<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LabFis: Administrasi Laboratorium Fisika SMA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#ECECE6;--sf:#FFFFFF;--sf2:#F5F5F0;--ink:#0D1A36;--ink2:#46526D;--ln:#D3D3CA;
  --co:#1B4DCC;--co-ink:#FFFFFF;--co-soft:#E3EAFC;--am:#E39B0B;--am-soft:#FFF0C9;--focus:#1B4DCC;
  --ok:#176B3B;--ok-bg:#DDF2E5;--ok-s:#2FA866;
  --bor:#7A5600;--bor-bg:#FFEFBA;--bor-s:#E0A800;
  --rep:#A24608;--rep-bg:#FFE4CF;--rep-s:#E8731A;
  --bro:#A81D24;--bro-bg:#FCDFE0;--bro-s:#D43A42;
  --shadow:0 1px 2px rgba(13,26,54,.06),0 8px 22px rgba(13,26,54,.07);
  --grid:rgba(27,77,204,.075);--grid2:rgba(27,77,204,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A111F;--sf:#121B31;--sf2:#18233D;--ink:#E9EEFA;--ink2:#A6B2CE;--ln:#27345A;
    --co:#3A66EE;--co-ink:#FFFFFF;--co-soft:#1A2850;--am:#F0B13A;--am-soft:#3A2D0B;--focus:#F0B13A;
    --ok:#83E0A6;--ok-bg:#12301F;--bor:#F3CF66;--bor-bg:#3A2E0A;--rep:#FFAD70;--rep-bg:#3D200C;--bro:#FF9297;--bro-bg:#40161A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--grid:rgba(120,160,255,.07);--grid2:rgba(120,160,255,.13);
  }
}
:root[data-theme="dark"]{
  --bg:#0A111F;--sf:#121B31;--sf2:#18233D;--ink:#E9EEFA;--ink2:#A6B2CE;--ln:#27345A;
  --co:#3A66EE;--co-ink:#FFFFFF;--co-soft:#1A2850;--am:#F0B13A;--am-soft:#3A2D0B;--focus:#F0B13A;
  --ok:#83E0A6;--ok-bg:#12301F;--bor:#F3CF66;--bor-bg:#3A2E0A;--rep:#FFAD70;--rep-bg:#3D200C;--bro:#FF9297;--bro-bg:#40161A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.35);--grid:rgba(120,160,255,.07);--grid2:rgba(120,160,255,.13);
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;overflow-x:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,'Times New Roman',serif;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.15}
h1{font-size:clamp(26px,4.5vw,36px)}h2{font-size:20px}h3{font-size:16px}
p{margin:0}a{color:var(--co);text-decoration:none}
a:hover{text-decoration:underline}
.mono,code{font-family:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace}
.muted{color:var(--ink2)}.small{font-size:13px}.right{text-align:right}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* kerangka */
.shell{min-height:100vh;display:block}
.sidebar{display:none}
.col{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--ln);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:10px 10px,10px 10px,50px 50px,50px 50px}
.logo{display:flex;align-items:center;gap:8px;font:700 20px 'Fraunces',Georgia,serif;color:var(--ink)}
.logo span.mk{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--co);color:#fff}
.topbar .sp{flex:1}
.iconbtn{display:inline-grid;place-items:center;min-width:44px;min-height:44px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);cursor:pointer}
.rolechip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--co-soft);color:var(--co);font-weight:700;font-size:13px}
:root[data-theme="dark"] .rolechip{color:#B9CCFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rolechip{color:#B9CCFF}}
.page{padding:18px 14px 110px;max-width:1180px;margin:0 auto;width:100%}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.ph .sub{color:var(--ink2);margin-top:4px}
.ruler{height:10px;margin:12px 0 18px;opacity:.5;background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 8px) left bottom/100% 5px no-repeat,repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px 40px) left bottom/100% 10px no-repeat}
.banner{margin:10px 14px 0;padding:10px 14px;border-radius:12px;background:var(--am-soft);border:1px solid var(--am);display:flex;gap:10px;align-items:flex-start;font-size:14px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:flex-end;justify-content:space-around;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:48px;color:var(--ink2);font-size:11.5px;font-weight:500;text-decoration:none;border-radius:10px}
.bnav a.on{color:var(--co);font-weight:700}
:root[data-theme="dark"] .bnav a.on{color:#9DB8FF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .bnav a.on{color:#9DB8FF}}
.bnav a.scan{flex:0 0 66px;margin-top:-26px;min-height:66px;border-radius:50%;background:var(--co);color:#fff;box-shadow:0 6px 18px rgba(27,77,204,.45);border:4px solid var(--bg)}
.bnav a.scan svg.i{width:26px;height:26px}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr)}
  .sidebar{display:flex;flex-direction:column;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:18px 14px;background:var(--sf);border-right:1px solid var(--ln);overflow:auto}
  .sidebar nav{display:flex;flex-direction:column;gap:2px;margin-top:10px}
  .sidebar nav a{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:10px;color:var(--ink);font-weight:500;text-decoration:none}
  .sidebar nav a:hover{background:var(--sf2)}
  .sidebar nav a.on{background:var(--co-soft);color:var(--co);font-weight:700}
  :root[data-theme="dark"] .sidebar nav a.on{color:#B9CCFF}
  .bnav{display:none}.topbar .logo{display:none}.page{padding-bottom:50px}
}

/* komponen */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;box-shadow:var(--shadow);padding:16px;min-width:0}
.card h2{margin-bottom:10px}
.grid{display:grid;gap:12px}
.gc{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:600 14px 'DM Sans',system-ui,sans-serif;cursor:pointer;text-decoration:none;transition:background .15s,transform .15s}
.btn:hover{background:var(--sf2);text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--co);border-color:var(--co);color:#fff}.btn.pri:hover{filter:brightness(1.08);background:var(--co)}
.btn.dng{background:var(--bro-bg);border-color:var(--bro);color:var(--bro)}
.btn.sm{min-height:44px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--co);font:600 14px 'DM Sans',sans-serif;cursor:pointer;min-height:44px;padding:0 8px;text-decoration:underline}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.badge svg.i{width:14px;height:14px;stroke-width:2.4}
.s-ok{background:var(--ok-bg);color:var(--ok)}.s-bor{background:var(--bor-bg);color:var(--bor)}.s-rep{background:var(--rep-bg);color:var(--rep)}.s-bro{background:var(--bro-bg);color:var(--bro)}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--sf2);border:1px solid var(--ln);font-size:12px;color:var(--ink2)}
.tag.sample{border-style:dashed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-radius:999px;background:var(--co-soft);font-size:13px}
.chip button{border:0;background:transparent;color:inherit;min-width:32px;min-height:32px;border-radius:50%;cursor:pointer}
.empty{display:grid;place-items:center;text-align:center;gap:8px;padding:34px 16px;color:var(--ink2);border:1.5px dashed var(--ln);border-radius:14px}
.empty svg.i{width:34px;height:34px}
.err{padding:10px 14px;border-radius:10px;background:var(--bro-bg);color:var(--bro);border:1px solid var(--bro);font-size:14px;margin-bottom:12px}
.err ul{margin:4px 0 0;padding-left:18px}
.okbox{padding:12px 14px;border-radius:10px;background:var(--ok-bg);color:var(--ok);border:1px solid var(--ok-s);margin-bottom:12px}

/* formulir */
.form{display:grid;gap:12px}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
label.f{display:grid;gap:5px;font-weight:600;font-size:13.5px}
label.f small{font-weight:400;color:var(--ink2)}
input,select,textarea{font:400 15px 'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:0 12px;min-height:44px;width:100%}
textarea{padding:10px 12px;min-height:90px;resize:vertical}
input[type=checkbox],input[type=radio]{width:22px;height:22px;min-height:22px;accent-color:var(--co)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--focus);outline-offset:1px}
.ck{display:flex;gap:10px;align-items:center;min-height:44px;font-weight:500}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar>*{flex:0 1 auto}
.toolbar input[type=search]{flex:1 1 220px}
.toolbar select{flex:1 1 140px;width:auto}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;background:var(--sf)}
.seg button{min-height:44px;padding:0 14px;border:0;background:transparent;color:var(--ink);font:600 14px 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.seg button.on{background:var(--co);color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.tabs button{min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:600 14px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs .n{display:inline-block;min-width:22px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--am);color:#1b1300;font-size:12px;line-height:20px}

/* tabel */
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);vertical-align:top}
th{font-size:12.5px;color:var(--ink2);font-weight:700;background:var(--sf2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.mono,th.mono{white-space:nowrap}

/* katalog */
.tcard{display:flex;flex-direction:column;gap:8px;padding:0;overflow:hidden;color:var(--ink);text-decoration:none;transition:transform .2s,box-shadow .2s}
.tcard:hover{transform:translateY(-2px);text-decoration:none}
.tcard .tb{padding:4px 14px 14px;display:grid;gap:6px}
.tcard h3{font-family:'DM Sans',sans-serif;font-size:15px}
.pbox{position:relative;aspect-ratio:4/3;background:var(--sf2);overflow:hidden;width:100%}
.pbox img{width:100%;height:100%;object-fit:cover;display:block}
.pbox.empty-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink2);font-size:13px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:12px 12px}
.pbox.empty-ph svg.i{width:30px;height:30px}
.sticker{position:absolute;left:8px;top:8px;z-index:2;background:#fff;color:#0D1A36;font:600 11px 'JetBrains Mono',monospace;padding:3px 8px;border-radius:5px;border:1px dashed #7d879e;transform:rotate(-1.5deg);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.units{font-size:13px;color:var(--ink2)}
.units b{color:var(--ink)}
.bar{height:6px;border-radius:99px;background:var(--sf2);overflow:hidden;border:1px solid var(--ln)}
.bar i{display:block;height:100%;background:var(--ok-s)}

/* dasbor */
.bento{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr))}
.stat{display:flex;flex-direction:column;gap:6px;padding:16px;border-radius:18px;text-decoration:none;color:inherit;border:1px solid var(--ln);transition:transform .2s}
.stat:hover{text-decoration:none;transform:translateY(-2px)}
.stat .n{font:700 clamp(40px,9vw,58px)/1 'Fraunces',Georgia,serif}
.stat .l{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px}
.stat.s-ok{background:var(--ok-bg)}.stat.s-bor{background:var(--bor-bg)}.stat.s-rep{background:var(--rep-bg)}.stat.s-bro{background:var(--bro-bg)}
.b-wide{grid-column:1/-1}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:170px;height:170px;flex:none}
.legend{display:grid;gap:8px;font-size:14px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.att{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.att li a{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--sf2);color:var(--ink);text-decoration:none;min-height:44px}
.att li a:hover{background:var(--co-soft)}
.att .t-warn svg{color:var(--rep)}.att .t-bad svg{color:var(--bro)}.att .t-info svg{color:var(--co)}
.ll{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.ll li{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:10px;background:var(--sf2)}
@media (min-width:760px){
  .bento{grid-template-columns:repeat(12,minmax(0,1fr))}
  .stat{grid-column:span 3}.b-donut{grid-column:span 5}.b-bars{grid-column:span 7}.b-loans{grid-column:span 7}.b-att{grid-column:span 5}
}

/* detail */
.two{display:grid;gap:14px}
@media (min-width:860px){.two{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.gal{display:grid;gap:8px}
.gal .main{border-radius:14px;overflow:hidden;border:1px solid var(--ln);cursor:zoom-in}
.thumbs{display:flex;gap:8px}
.thumbs button{width:84px;padding:0;border:2px solid var(--ln);border-radius:10px;overflow:hidden;background:none;cursor:pointer}
.thumbs button.on{border-color:var(--co)}
.thumbs img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 12px;margin:0}
dl.kv dt{color:var(--ink2);font-size:13.5px}dl.kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.uchips{display:flex;gap:8px;flex-wrap:wrap}
.qrbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.qrbox svg{width:150px;height:150px;border:1px solid var(--ln);border-radius:10px;background:#fff}
.tl{list-style:none;margin:0;padding:0 0 0 18px;border-left:2px solid var(--ln);display:grid;gap:14px}
.tl li{position:relative}
.tl li::before{content:'';position:absolute;left:-25px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--co);border:2px solid var(--sf)}
.tl .when{font:400 12px 'JetBrains Mono',monospace;color:var(--ink2)}
.tl img{max-width:160px;border-radius:8px;margin-top:6px;display:block}

/* modal */
.scrim{position:fixed;inset:0;z-index:100;background:rgba(7,12,26,.55);display:grid;place-items:center;padding:14px;overflow:auto}
.dialog{background:var(--sf);color:var(--ink);border-radius:16px;border:1px solid var(--ln);box-shadow:0 20px 60px rgba(0,0,0,.4);padding:20px;width:min(520px,100%);max-height:calc(100vh - 28px);overflow:auto;animation:pop .2s ease-out}
.dialog.wide{width:min(860px,100%)}
.dialog h2{margin-bottom:8px}
.dialog .btns{justify-content:flex-end;margin-top:14px}
.lb{overflow:auto;max-height:78vh;border-radius:10px}
.lb img{width:100%;display:block;cursor:zoom-in}.lb.zoom img{width:220%;cursor:zoom-out}
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:120;display:grid;justify-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media (min-width:900px){.toast-wrap{bottom:24px}}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);animation:pop .2s ease-out;max-width:560px}

/* autentikasi */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px 14px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);background-size:12px 12px,12px 12px,60px 60px,60px 60px}
.authcard{width:min(440px,100%);display:grid;gap:14px;padding:22px}
.authcard.wide{width:min(640px,100%)}
.rolepick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rolepick button{display:grid;gap:4px;justify-items:center;padding:10px 6px;min-height:72px;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.rolepick button[aria-checked=true]{border-color:var(--co);background:var(--co-soft);color:var(--co)}
:root[data-theme="dark"] .rolepick button[aria-checked=true]{color:#B9CCFF}
.rolepick small{font-weight:400;color:var(--ink2);font-size:11.5px}
.dots{display:flex;justify-content:center;gap:14px;min-height:20px}
.dots span{width:15px;height:15px;border-radius:50%;border:2px solid var(--ink2);transition:background .12s}
.dots span.on{background:var(--co);border-color:var(--co)}
.dots.shake{animation:shake .4s}
.msg{min-height:22px;text-align:center;font-size:14px;color:var(--bro);font-weight:600}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;width:100%}
.pad button{min-height:60px;border-radius:14px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font:600 22px 'JetBrains Mono',monospace;cursor:pointer;transition:background .12s}
.pad button:active{background:var(--co-soft)}
.pad button.fn{font:600 13px 'DM Sans',sans-serif}
.code{font:600 22px/1.3 'JetBrains Mono',monospace;letter-spacing:.08em;text-align:center;padding:16px;border-radius:12px;border:2px dashed var(--am);background:var(--am-soft);word-break:break-all;user-select:all}
.sk{background:linear-gradient(90deg,var(--sf2),var(--ln),var(--sf2));background-size:200% 100%;animation:sk 1.2s infinite linear;border-radius:12px}
@keyframes sk{to{background-position:-200% 0}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

/* ============ Penyimpanan (storage adapter) ============ */
const Store=(()=>{
  let mode='memory',db=null;const mem=new Map();
  const idb=(m,fn)=>new Promise((res,rej)=>{try{const tx=db.transaction('kv',m);const st=tx.objectStore('kv');const rq=fn(st);tx.oncomplete=()=>res(rq?rq.result:undefined);tx.onerror=tx.onabort=()=>rej(tx.error||new Error('idb'))}catch(e){rej(e)}});
  return{
    get mode(){return mode},
    async init(){
      try{
        if(!window.indexedDB)throw 0;
        db=await new Promise((res,rej)=>{const r=indexedDB.open('labfis',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'))});
        await idb('readwrite',s=>s.put('1','__t'));await idb('readwrite',s=>s.delete('__t'));mode='idb';return;
      }catch(e){db=null}
      try{localStorage.setItem('__t','1');localStorage.removeItem('__t');mode='ls'}catch(e){mode='memory'}
    },
    async get(k){try{let v;if(mode==='idb')v=await idb('readonly',s=>s.get(k));else if(mode==='ls')v=localStorage.getItem(k);else v=mem.get(k);return v==null?null:JSON.parse(v)}catch(e){try{return mem.has(k)?JSON.parse(mem.get(k)):null}catch(_){return null}}},
    async set(k,v){const s=JSON.stringify(v);try{if(mode==='idb')await idb('readwrite',st=>st.put(s,k));else if(mode==='ls')localStorage.setItem(k,s);else mem.set(k,s);return true}catch(e){mem.set(k,s);mode='memory';return false}},
    async delete(k){try{if(mode==='idb')await idb('readwrite',s=>s.delete(k));else if(mode==='ls')localStorage.removeItem(k);else mem.delete(k);return true}catch(e){mem.delete(k);return false}},
    async list(prefix=''){try{if(mode==='idb')return(await idb('readonly',s=>s.getAllKeys())).filter(k=>String(k).startsWith(prefix));if(mode==='ls')return Object.keys(localStorage).filter(k=>k.startsWith(prefix));return[...mem.keys()].filter(k=>k.startsWith(prefix))}catch(e){return[]}}
  };

/* ============ Kripto PIN (WebCrypto PBKDF2-SHA-256) ============ */
const ITER=150000,te=new TextEncoder();
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function derive(secret,salt,it){const k=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations:it},k,256))}
const ctEq=(a,b)=>{if(a.length!==b.length)return false;let d=0;for(let i=0;i<a.length;i++)d|=a[i]^b[i];return d===0};
async function makeCred(secret){const salt=crypto.getRandomValues(new Uint8Array(16));return{salt:b64(salt),hash:b64(await derive(secret,salt,ITER)),it:ITER}}
async function checkCred(secret,c){if(!c)return false;return ctEq(await derive(secret,unb64(c.salt),c.it),unb64(c.hash))}
function weakPin(p){if(/^(\d)\1+$/.test(p))return true;let up=true,dn=true;for(let i=1;i<p.length;i++){const d=+p[i]-+p[i-1];if(d!==1)up=false;if(d!==-1)dn=false}return up||dn}
function genRecovery(){const al='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',r=crypto.getRandomValues(new Uint8Array(16));let s='';r.forEach((v,i)=>{s+=al[v%al.length];if(i%4===3&&i<15)s+='-'});return s}

/* ============ Toast, modal ============ */
function toast(msg,ms=3200){const w=$('#toasts'),e=document.createElement('div');e.className='toast';e.textContent=msg;w.appendChild(e);setTimeout(()=>e.remove(),ms)}
const modals=[];
function modal(html,{label='Dialog',wide=false}={}){const m=document.createElement('div');m.className='scrim';m.innerHTML=`<div class="dialog ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`;
  document.body.appendChild(m);modals.push(m);m.addEventListener('mousedown',e=>{if(e.target===m&&!m.dataset.sticky)closeModal(m)});
  const f=$('input:not([type=hidden]):not([type=file]),select,textarea,button',m);if(f)setTimeout(()=>f.focus(),30);return m}
function closeModal(m){m=m||modals[modals.length-1];if(!m)return;const i=modals.indexOf(m);if(i>=0)modals.splice(i,1);m.remove()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modals.length){const m=modals[modals.length-1];if(!m.dataset.sticky)closeModal(m)}});
function confirmBox(title,msg,ok='Ya, lanjutkan',danger=false){return new Promise(res=>{const m=modal(`<h2>${esc(title)}</h2><p>${esc(msg)}</p><div class="btns"><button class="btn" data-x="0">Batal</button><button class="btn ${danger?'dng':'pri'}" data-x="1">${esc(ok)}</button></div>`,{label:title});
  m.addEventListener('click',e=>{const b=e.target.closest('[data-x]');if(!b)return;closeModal(m);res(b.dataset.x==='1')});const o=new MutationObserver(()=>{if(!document.body.contains(m)){o.disconnect();res(false)}});o.observe(document.body,{childList:true})})}
function reasonBox(title,label){return new Promise(res=>{const m=modal(`<h2>${esc(title)}</h2><form data-form="reason" class="form"><label class="f">${esc(label)}<textarea name="r" required maxlength="300"></textarea></label><div id="rerr"></div><div class="btns"><button type="button" class="btn" data-x="0">Batal</button><button class="btn dng" type="submit">Tolak permohonan</button></div></form>`,{label:title});
  m.addEventListener('click',e=>{if(e.target.closest('[data-x]')){closeModal(m);res(null)}});
  m.querySelector('form').addEventListener('submit',e=>{e.preventDefault();e.stopPropagation();const v=e.target.r.value.trim();if(!v){$('#rerr',m).innerHTML='<div class="err" role="alert">Alasan penolakan wajib diisi.</div>';return}closeModal(m);res(v)},true)})}
const errBox=l=>l.length?`<div class="err" role="alert"><b>Periksa kembali:</b><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'';
async function copyText(t,ok='Tersalin ke papan klip'){try{await navigator.clipboard.writeText(t);toast(ok);return}catch(e){}
  const ta=document.createElement('textarea');ta.value=t;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(ok)}catch(e){toast('Salin manual: pilih teks lalu tekan salin pada perangkat Anda.')}ta.remove()}

function qrSvg(text){try{const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount();let d='';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))d+=`M${c+3} ${r+3}h1v1h-1z`;
  return`<svg viewBox="0 0 ${n+6} ${n+6}" role="img" aria-label="Kode QR menuju ${esc(text)}"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></svg>`}catch(e){return`<div class="empty small">QR tidak dapat dibuat. Kode: <b class="mono">${esc(text)}</b></div>`}}

/* ============ Foto ============ */
const okImg=s=>typeof s==='string'&&/^data:image\/(webp|jpeg|png|gif);base64,/.test(s);
function compress(file,max=900,limit=120e3){return new Promise((res,rej)=>{if(!file||!/^image\//.test(file.type))return rej(new Error('Berkas harus berupa gambar.'));
  const fr=new FileReader();fr.onerror=()=>rej(new Error('Berkas tidak dapat dibaca.'));
  fr.onload=()=>{const img=new Image();img.onerror=()=>rej(new Error('Gambar tidak dapat dibuka.'));img.onload=()=>{let sc=Math.min(1,max/Math.max(img.width,img.height)),out='';
    const fmt=document.createElement('canvas').toDataURL('image/webp').startsWith('data:image/webp')?'image/webp':'image/jpeg';
    for(let k=0;k<4;k++){const w=Math.max(1,Math.round(img.width*sc)),h=Math.max(1,Math.round(img.height*sc));const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      let q=.82;out=c.toDataURL(fmt,q);while(out.length*.75>limit&&q>.4){q-=.1;out=c.toDataURL(fmt,q)}if(out.length*.75<=limit)break;sc*=.8}res(out)};img.src=fr.result};fr.readAsDataURL(file)})}
function photoBox(t,i=0){const p=t.photos&&t.photos[i];const st=`<span class="sticker">${esc(t.code)}</span>`;
  return p?`<div class="pbox">${st}<img loading="lazy" src="${p}" alt="Foto ${esc(t.name)} (${esc(t.code)})"></div>`:`<div class="pbox empty-ph">${st}${icon('camera')}<span>Foto belum tersedia</span></div>`}

const LOCKS=[30,60,300,900];

function afterAuth(){if(!A||view!=='login')return;updateDots();startLockTick();window._authMsg=''}
function updateDots(){const d=$('#dots');if(!d)return;d.innerHTML=[0,1,2,3,4,5].map(i=>`<span class="${i<L.pin.length?'on':''}"></span>`).join('');d.setAttribute('aria-label',`${L.pin.length} dari 6 digit`)}
function startLockTick(){clearInterval(lockI);const tick=()=>{const m=$('#loginMsg');if(!m||!A){clearInterval(lockI);return}const lk=lockOf(L.role),left=Math.ceil((lk.until-Date.now())/1000);if(left>0)m.textContent=`Percobaan terlalu banyak. Coba lagi dalam ${fmtDur(left)}.`;else if(m.textContent.startsWith('Percobaan terlalu')){m.textContent=''}};tick();lockI=setInterval(tick,1000)}
function pressKey(k){if(authBusy||role||!A||view!=='login')return;if(L.pin.length>=6)return;L.pin+=k;updateDots();if(L.pin.length===6)attempt()}
async function attempt(){
  const lk=lockOf(L.role),msg=$('#loginMsg');
  if(Date.now()<lk.until){L.pin='';updateDots();startLockTick();return}
  authBusy=true;let ok=false;try{ok=await checkCred(L.pin,A[L.role])}catch(e){ok=false}
  const r=L.role;L.pin='';
  if(ok){lk.fails=0;lk.level=0;lk.until=0;await saveAuth();authBusy=false;trail('Masuk berhasil',ROLES[r].name,r);startSession(r);return}
  lk.fails++;let lockedNow=false;
  if(lk.fails>=5){lk.until=Date.now()+LOCKS[Math.min(lk.level,3)]*1000;lk.level++;lk.fails=0;lockedNow=true;trail('Peran terkunci sementara',ROLES[r].name,'sistem')}else trail('Masuk gagal',ROLES[r].name,'sistem');
  await saveAuth();authBusy=false;updateDots();const d=$('#dots');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}
  if(msg&&!lockedNow)msg.textContent='PIN tidak sesuai';else startLockTick();
}
function wizardHTML(reset){const rows=Object.entries(ROLES).map(([k,r])=>`<fieldset style="border:1px solid var(--ln);border-radius:12px;padding:12px;margin:0"><legend><b>${esc(r.name)}</b></legend><div class="fr"><label class="f">PIN 6 digit<input type="password" name="p_${k}" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="new-password" required></label><label class="f">Ulangi PIN<input type="password" name="c_${k}" inputmode="numeric" pattern="\\d{6}" maxlength="6" autocomplete="new-password" required></label></div></fieldset>`).join('');

function pinErrors(pins,confirm){const e=[];for(const [k,r] of Object.entries(ROLES)){const p=pins[k];if(!/^\d{6}$/.test(p))e.push(`PIN ${r.short} harus tepat 6 angka.`);else if(weakPin(p))e.push(`PIN ${r.short} terlalu mudah ditebak (angka sama atau berurutan).`);else if(confirm&&p!==confirm[k])e.push(`Konfirmasi PIN ${r.short} tidak sama.`)}
  if(!e.length&&new Set(Object.values(pins)).size<3)e.push('Setiap peran harus memakai PIN yang berbeda.');return e}
async function doSetup(f,reset){
  if(!(window.crypto&&crypto.subtle)){$('#werr').innerHTML=errBox(['Peramban ini tidak mendukung WebCrypto. Buka LabFis lewat HTTPS di peramban terbaru.']);return}
  const g=k=>f.elements[k].value.trim(),pins={},conf={};for(const k of Object.keys(ROLES)){pins[k]=g('p_'+k);conf[k]=g('c_'+k)}
  const errs=pinErrors(pins,conf);if(errs.length){$('#werr').innerHTML=errBox(errs);return}
  const btn=$('button[type=submit]',f);btn.disabled=true;btn.textContent='Menyimpan…';
  try{const N={lock:{}};for(const k of Object.keys(ROLES))N[k]=await makeCred(pins[k]);const code=genRecovery();N.rec=await makeCred(code.replace(/-/g,''));
    A=N;await saveAuth();if(!reset&&f.elements.school){const s=f.elements.school.value.trim();if(s)S.settings.school=s.slice(0,80)}
    trail(reset?'PIN direset dengan kode pemulihan':'PIN awal dibuat','Tiga peran','sistem');save();newCode=code;view='code';render()}

/* ============ Sesi ============ */
const IDLE=15*60e3,WARN=30e3;let idleT=null,warnM=null,warnI=null;
function touch(){if(!role||warnM)return;clearTimeout(idleT);idleT=setTimeout(showWarn,IDLE-WARN)}
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,touch,{passive:true}));
function showWarn(){if(!role||warnM)return;let left=30;warnM=modal(`<h2>Sesi akan berakhir</h2><p>Karena tidak ada aktivitas, Anda akan keluar otomatis dalam <b id="cd">30</b> detik.</p><div class="btns"><button class="btn" data-act="logout">Keluar sekarang</button><button class="btn pri" data-act="stay">Tetap masuk</button></div>`,{label:'Peringatan sesi'});warnM.dataset.sticky='1';
  warnI=setInterval(()=>{left--;const c=$('#cd');if(c)c.textContent=left;if(left<=0)logout('Sesi berakhir karena tidak ada aktivitas selama 15 menit.')},1000)}
function stay(){clearInterval(warnI);if(warnM){closeModal(warnM);warnM=null}touch()}
function startSession(r){role=r;view='login';L.pin='';window._authMsg='';clearInterval(lockI);touch();const p=pending;pending='';const h=p&&/^#\/(alat|katalog)/.test(p)?p:(r==='siswa'?'#/katalog':'#/');history.replaceState(null,'',h);render()}
function logout(msg){clearTimeout(idleT);clearInterval(warnI);warnM=null;if(role)trail('Keluar',msg?'otomatis (tidak aktif)':'manual');const h=location.hash;if(msg&&/^#\/alat\//.test(h))pending=h;role=null;stopCam();[...modals].forEach(m=>closeModal(m));view='login';L.pin='';window._authMsg=msg||'';render()}
/* ============ Routing & kerangka ============ */
function route(){let h=location.hash.replace(/^#\/?/,'');const i=h.indexOf('/');let p=(i<0?h:h.slice(0,i));let arg=i<0?'':h.slice(i+1);try{arg=decodeURIComponent(arg)}catch(e){}return{page:p||(role==='siswa'?'katalog':'dasbor'),arg}}
const go=h=>{if(location.hash===h)render();else location.hash=h};
const NAV=[['dasbor','Dasbor','home'],['katalog','Katalog Alat','grid'],['pinjam','Peminjaman','swap'],['rawat','Pemeliharaan','wrench'],['audit','Audit dan Pendataan','clipboard'],['qr','Kode dan Label QR','qr'],['kelola','Kelola Alat','edit'],['laporan','Laporan','doc'],['pengaturan','Pengaturan','sliders'],['tentang','Tentang dan Atribusi','info']];
const MORE=['rawat','audit','qr','kelola','laporan','pengaturan','tentang','lainnya'];
function shell(content,page){
  const on=k=>page===k||(k==='katalog'&&page==='alat')||(k==='lainnya'&&MORE.includes(page));
  const side=NAV.filter(([k])=>can('page.'+k)).map(([k,l,ic])=>`<a href="#/${k==='dasbor'?'':k}" class="${on(k)?'on':''}" ${on(k)?'aria-current="page"':''}>${icon(ic)}${l}</a>`).join('');
  const bn=(k,l,ic)=>`<a href="#/${k}" class="${on(k)?'on':''}">${icon(ic)}<span>${l}</span></a>`;
  const bottom=role==='siswa'?bn('katalog','Katalog','grid')+`<a href="#/pindai" class="scan" aria-label="Pindai QR">${icon('scan')}</a>`+bn('pinjam','Pinjam','swap')+bn('tentang','Tentang','info')
    :bn('','Dasbor','home').replace('href="#/"','href="#/"')+bn('katalog','Katalog','grid')+`<a href="#/pindai" class="scan" aria-label="Pindai QR">${icon('scan')}</a>`+bn('pinjam','Pinjam','swap')+bn('lainnya','Lainnya','more');
  return`<div class="shell"><aside class="sidebar noprint"><div class="logo">${'<span class="mk">'+icon('flask')+'</span>'}LabFis</div><p class="small muted">${esc(S.settings.school)}</p>
   <a class="btn pri" href="#/pindai" style="margin-top:8px">${icon('scan')}Pindai QR</a><nav aria-label="Menu utama">${side}</nav>
   <div style="margin-top:auto;display:grid;gap:8px"><span class="rolechip">${icon(ROLES[role].ic)}${esc(ROLES[role].name)}</span><button class="btn sm" data-act="theme">${icon('moon')}Ganti tema</button><button class="btn sm" data-act="logout">${icon('logout')}Keluar</button></div></aside>
  <div class="col"><header class="topbar noprint"><div class="logo"><span class="mk">${icon('flask')}</span>LabFis</div><span class="sp"></span><span class="rolechip">${esc(ROLES[role].short)}</span><button class="iconbtn" data-act="theme" aria-label="Ganti tema">${icon('moon')}</button><button class="iconbtn" data-act="logout" aria-label="Keluar">${icon('logout')}</button></header>
  ${Store.mode==='memory'?`<div class="banner noprint" role="status">${icon('alert')}<span><b>Mode sementara:</b> data tidak tersimpan permanen. Tutup aplikasi berarti perubahan hilang.</span></div>`:''}
  <main class="page" id="main">${content}</main></div><nav class="bnav noprint" aria-label="Menu bawah">${bottom}</nav></div>`}
const PAGES={};
function render(keep){
  stopCam();const app=$('#app');
  if(!role||!S){app.innerHTML=authView();afterAuth();return}
  const r=route();const pg=PAGES[r.page];
  if(!pg||!can('page.'+r.page)){history.replaceState(null,'',role==='siswa'?'#/katalog':'#/');return render()}
  const y=window.scrollY;
  try{app.innerHTML=shell(pg.html(r.arg),r.page)}catch(e){console.error(e);app.innerHTML=shell(`<div class="empty">${icon('alert')}<b>Halaman tidak dapat ditampilkan.</b><span>Muat ulang aplikasi atau kembali ke dasbor.</span><a class="btn" href="#/">Ke beranda</a></div>`,r.page)}
  if(pg.after)try{pg.after(r.arg)}catch(e){console.error(e)}
  window.scrollTo(0,keep?y:0);document.title=(pg.title||'LabFis')+' | LabFis';
}
window.addEventListener('hashchange',()=>{if(!role){const h=location.hash;if(/^#\/alat\//.test(h))pending=h;return}render()});

function loanFlag(l){const d=dayDiff(l.dateDue,today());if(d<0)return`<span class="badge s-bro">${icon('alert')}Terlambat ${-d} hari</span>`;if(d===0)return`<span class="badge s-rep">${icon('clock')}Jatuh tempo hari ini</span>`;if(d===1)return`<span class="badge s-bor">${icon('clock')}Jatuh tempo besok</span>`;return`<span class="tag">Kembali ${fmtDate(l.dateDue)}</span>`}
function nextDue(s){return addDays(s.last,s.every)}
function attention(){
  const T=today(),a=[],add=(t,ic,x,h,ui)=>a.push({t,ic,x,h,ui});
  const pend=S.loans.filter(l=>l.status==='menunggu').length;
  if(pend)add('info','swap',`${pend} permohonan peminjaman menunggu persetujuan`,'#/pinjam',['pj',can('loan.decide')?'antrean':'aktif']);
  activeLoans().forEach(l=>{const d=dayDiff(l.dateDue,T),t=getTool(l.code);if(d<0)add('bad','alert',`${t?t.name:l.code} terlambat ${-d} hari (${l.name})`,'#/pinjam',['pj','aktif']);else if(d<=1)add('warn','clock',`${t?t.name:l.code} jatuh tempo ${d===0?'hari ini':'besok'} (${l.name})`,'#/pinjam',['pj','aktif'])});
  S.tools.forEach(t=>{const s=statusOf(t);if(s==='rusak'||s==='perbaikan')add(s==='rusak'?'bad':'warn','wrench',`${t.name}: ${ST[s].label.toLowerCase()}`,'#/alat/'+t.code)});
  S.tools.filter(t=>t.trace).forEach(t=>add('warn','search',`${t.name} perlu ditelusuri (${t.trace})`,can('page.audit')?'#/audit':'#/alat/'+t.code,['au','telusur']));
  S.sched.forEach(s=>{const d=dayDiff(nextDue(s),T),t=getTool(s.code);if(d<0)add('bad','cal',`Pemeliharaan ${s.type} ${t?t.name:s.code} terlambat ${-d} hari`,'#/rawat',['rw','jadwal']);else if(d<=14)add('info','cal',`Pemeliharaan ${s.type} ${t?t.name:s.code} dalam ${d} hari`,'#/rawat',['rw','jadwal'])});
  if(can('backup')){const lb=S.meta.lastBackup;if(!lb)add('warn','copy','Data belum pernah dicadangkan','#/pengaturan');else if(Date.now()-lb>7*864e5)add('warn','copy',`Cadangan terakhir ${Math.floor((Date.now()-lb)/864e5)} hari lalu`,'#/pengaturan')}
  return a}
function donut(c){const tot=Object.values(c).reduce((a,b)=>a+b,0)||1,R=40,C=2*Math.PI*R;let off=0;const col={tersedia:'var(--ok-s)',dipinjam:'var(--bor-s)',perbaikan:'var(--rep-s)',rusak:'var(--bro-s)'};
  const seg=Object.keys(ST).map(k=>{const len=c[k]/tot*C;const s=`<circle r="${R}" cx="60" cy="60" fill="none" stroke="${col[k]}" stroke-width="16" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=len;return s}).join('');
  return`<svg viewBox="0 0 120 120" role="img" aria-label="Donat status: ${Object.keys(ST).map(k=>ST[k].label+' '+c[k]).join(', ')}"><circle r="${R}" cx="60" cy="60" fill="none" stroke="var(--sf2)" stroke-width="16"/>${seg}<text x="60" y="58" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-weight="700" font-size="24" fill="var(--ink)">${tot}</text><text x="60" y="74" text-anchor="middle" font-size="9" fill="var(--ink2)" font-family="DM Sans,sans-serif">jenis alat</text></svg>`}
function barsSvg(){
  const rows=Object.keys(CATS).map(k=>{const ts=S.tools.filter(t=>catOf(t)===k);return{k,n:ts.length,b:ts.filter(t=>t.cond==='baik').length,r:ts.filter(t=>t.cond==='rusak ringan').length,w:ts.filter(t=>t.cond==='rusak berat').length}});
  const max=Math.max(...rows.map(r=>r.n),1),x0=150,W=440,sc=(W-x0-30)/max,H=rows.length*32+8;
  const body=rows.map((r,i)=>{const y=i*32+6;let x=x0;const seg=(v,f)=>{if(!v)return'';const w=v*sc,s=`<rect x="${x}" y="${y}" width="${w}" height="20" rx="3" fill="${f}"/>`;x+=w;return s};
    return`<text x="0" y="${y+14}" font-size="12" fill="var(--ink)" font-family="DM Sans,sans-serif">${esc(CATS[r.k])}</text>${seg(r.b,'var(--ok-s)')}${seg(r.r,'var(--bor-s)')}${seg(r.w,'var(--bro-s)')}<text x="${x+6}" y="${y+14}" font-size="12" fill="var(--ink2)" font-family="JetBrains Mono,monospace">${r.n}</text>`}).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Kondisi alat per kategori: ${rows.map(r=>`${CATS[r.k]} baik ${r.b}, rusak ringan ${r.r}, rusak berat ${r.w}`).join('; ')}" style="width:100%;height:auto">${body}</svg>
  <div class="legend" style="grid-auto-flow:column;justify-content:start;gap:16px;margin-top:6px;font-size:13px"><div><i style="background:var(--ok-s)"></i>Baik</div><div><i style="background:var(--bor-s)"></i>Rusak ringan</div><div><i style="background:var(--bro-s)"></i>Rusak berat</div></div>`}

  after(){if(reduceMotion())return;$$('[data-count]').forEach(el=>{const n=+el.dataset.count,t0=performance.now();const f=t=>{const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(n*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}};

/* ============ Katalog ============ */
function filteredTools(){const f=UI.cat,q=f.q.trim().toLowerCase();
  let a=S.tools.filter(t=>{if(q&&!(t.code+' '+t.name+' '+t.spec).toLowerCase().includes(q))return false;if(f.cat&&catOf(t)!==f.cat)return false;if(f.st&&statusOf(t)!==f.st)return false;if(f.loc&&t.loc!==f.loc)return false;if(f.cls&&!clsList(t.cls).includes(f.cls))return false;if(f.fund&&t.fund!==f.fund)return false;return true});
  const so={code:(x,y)=>x.code.localeCompare(y.code),nama:(x,y)=>x.name.localeCompare(y.name,'id'),kategori:(x,y)=>CATS[catOf(x)].localeCompare(CATS[catOf(y)])||x.code.localeCompare(y.code),status:(x,y)=>Object.keys(ST).indexOf(statusOf(y))-Object.keys(ST).indexOf(statusOf(x))||x.code.localeCompare(y.code)};
  return a.sort(so[f.sort]||so.code)}

  if(UI.cat.view==='table')return`<div class="tw"><table><thead><tr><th>Kode</th><th>Nama alat</th><th>Kategori</th><th>Lokasi</th><th>Kelas</th><th>Status</th><th>Unit</th>${can('tool.fund')?'<th>Sumber dana</th>':''}</tr></thead><tbody>${a.map(t=>`<tr><td class="mono"><a href="#/alat/${esc(t.code)}">${esc(t.code)}</a></td><td>${esc(t.name)}</td><td>${esc(CATS[catOf(t)])}</td><td>${esc(t.loc)}</td><td>${esc(t.cls)}</td><td>${badge(statusOf(t))}</td><td class="mono">${avail(t)}/${t.total}</td>${can('tool.fund')?`<td>${esc(t.fund)}</td>`:''}</tr>`).join('')}</tbody></table></div>`;
  return`<div class="grid gc">${a.map(t=>{const s=statusOf(t);return`<a class="card tcard" href="#/alat/${esc(t.code)}">${photoBox(t)}<div class="tb"><h3>${esc(t.name)}</h3><span class="small muted">${esc(CATS[catOf(t)])}, ${esc(t.loc)}</span>${badge(s)}<span class="units"><b>${avail(t)}</b> dari ${t.total} ${esc(t.u)} tersedia</span><div class="bar" aria-hidden="true"><i style="width:${Math.round(avail(t)/t.total*100)}%"></i></div></div></a>`}).join('')}</div>`}

   <select data-on="cat" data-k="sort" aria-label="Urutkan"><option value="code" ${f.sort==='code'?'selected':''}>Urut: kode</option><option value="nama" ${f.sort==='nama'?'selected':''}>Urut: nama</option><option value="kategori" ${f.sort==='kategori'?'selected':''}>Urut: kategori</option><option value="status" ${f.sort==='status'?'selected':''}>Urut: status (bermasalah dulu)</option></select>

/* ============ Detail alat ============ */
function timeline(t){const ev=[],ms=iso=>Date.parse(iso+'T12:00:00');
  S.loans.filter(l=>l.code===t.code).forEach(l=>{ev.push({ts:l.ts,ic:'swap',x:`Pengajuan ${l.qty} ${t.u} oleh ${l.name} (${l.who})`,m:l.purpose});
    if(l.decidedAt&&l.status!=='ditolak')ev.push({ts:l.decidedAt,x:`Peminjaman ${l.id} disetujui`});
    if(l.status==='ditolak')ev.push({ts:l.decidedAt||l.ts,x:`Peminjaman ${l.id} ditolak`,m:l.reason});
    if(l.returnedAt)ev.push({ts:l.returnedAt,x:`Dikembalikan (${l.id}), kondisi ${l.returnCond||'baik'}`,m:l.returnNote,p:l.returnPhoto})});
  S.maint.filter(m=>m.code===t.code).forEach(m=>ev.push({ts:ms(m.date),x:`${m.type[0].toUpperCase()+m.type.slice(1)}${m.units?`, ${m.units} unit`:''}: ${m.status}`,m:[m.finding,m.action,m.result&&('Hasil: '+m.result)].filter(Boolean).join(' | '),p:m.photo}));
  S.audits.filter(a=>a.code===t.code).forEach(a=>ev.push({ts:ms(a.date),x:`Audit: ditemukan ${a.qtyFound} ${t.u}, kondisi ${a.cond}, lokasi ${a.loc}`,m:a.note,p:a.photo}));
  return ev.sort((a,b)=>b.ts-a.ts)}

/* ============ Pindai QR ============ */
const cam={stream:null,t:0,det:null};
function stopCam(){clearTimeout(cam.t);if(cam.stream){cam.stream.getTracks().forEach(x=>x.stop());cam.stream=null}}
function handleScan(val){const m=String(val).match(/FIS-[A-Z]{3}-\d{3}/i);if(!m)return false;const code=m[0].toUpperCase();if(!getTool(code)){const e=$('#scanMsg');if(e)e.textContent=`Kode ${code} tidak ada di data. Periksa kembali.`;return false}stopCam();toast('Kode terbaca: '+code);go('#/alat/'+code);return true}
async function startCam(){const v=$('#camv'),msg=$('#scanMsg');if(!v)return;msg.textContent='';
  try{if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw Object.assign(new Error('x'),{name:'NoSupport'});
    cam.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});v.srcObject=cam.stream;await v.play();$('#camwrap').hidden=false;$('#camBtn').hidden=true;
    if('BarcodeDetector' in window){cam.det=new BarcodeDetector({formats:['qr_code']});msg.textContent='Arahkan kamera ke kode QR pada alat.';const loop=async()=>{if(!cam.stream)return;try{const r=await cam.det.detect(v);if(r.length&&handleScan(r[0].rawValue))return}catch(e){}cam.t=setTimeout(loop,250)};loop()}
    else msg.textContent='Peramban ini belum bisa membaca QR otomatis. Ketik kode alat di bawah, misalnya FIS-OPT-001.'}
  catch(e){stopCam();msg.textContent=e.name==='NotAllowedError'||e.name==='SecurityError'?'Izin kamera ditolak. Aktifkan izin kamera di pengaturan peramban lalu coba lagi, atau ketik kode alat di bawah.':e.name==='NotFoundError'?'Kamera tidak ditemukan di perangkat ini. Ketik kode alat di bawah.':'Kamera tidak dapat dibuka di tampilan ini. Ketik kode alat di bawah.'}}
PAGES.pindai={title:'Pindai QR',html(){return`<header class="ph"><div><h1>Pindai QR alat</h1><p class="sub">Arahkan kamera ke stiker QR, atau ketik kode alat.</p></div></header><div class="ruler" aria-hidden="true"></div>
  <div class="two"><section class="card"><div id="camwrap" hidden style="border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px"><video id="camv" playsinline muted style="width:100%;display:block;max-height:60vh"></video></div>
   <button class="btn pri" id="camBtn" data-act="startCam">${icon('camera')}Buka kamera</button><p id="scanMsg" class="small muted" role="status" style="margin-top:10px"></p></section>

  return`<header class="ph"><div><h1>Peminjaman</h1><p class="sub">Ajukan, setujui, dan kembalikan alat dengan jejak yang jelas.</p></div></header><div class="ruler" aria-hidden="true"></div>
  <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button role="tab" aria-selected="${UI.pj===k}" class="${UI.pj===k?'on':''}" data-act="tab" data-k="pj" data-v="${k}">${l}${n?`<span class="n">${n}</span>`:''}</button>`).join('')}</div>${body}`},
  after(){UI.done='';UI.pre.tool='';const s=$('select[name=code]');if(s&&s.value)updateQtyHint(s)}};
function updateQtyHint(sel){const t=getTool(sel.value),q=$('#qty'),h=$('#qtyHint');if(!q||!h)return;if(!t){h.textContent='Pilih alat untuk melihat unit tersedia.';q.removeAttribute('max');return}q.max=Math.max(1,avail(t));h.textContent=`Maksimum ${avail(t)} ${t.u} (tersedia).`}

  if(UI.rw==='tambah'){const pre=UI.pre.mt||'';body=`<section class="card"><h2>Catatan pemeliharaan baru</h2><form class="form" data-form="maint" novalidate>
   <div class="fr"><label class="f">Alat<select name="code" required><option value="">Pilih alat</option>${toolOpts(pre)}</select></label><label class="f">Jenis<select name="type"><option value="pemeriksaan">Pemeriksaan</option><option value="perbaikan">Perbaikan</option><option value="kalibrasi">Kalibrasi</option></select></label></div>

   <label class="f">Foto (opsional)<input type="file" accept="image/*" data-on="phTmp" data-k="maint"></label><div id="prev-maint"></div><div id="merr"></div><button class="btn pri" type="submit">${icon('check')}Simpan catatan</button></form></section>`}
  return`<header class="ph"><div><h1>Pemeliharaan</h1><p class="sub">Riwayat perbaikan, kalibrasi, dan jadwal pemeriksaan rutin.</p></div>${can('damage.report')?`<button class="btn" data-act="damage">${icon('alert')}Lapor kerusakan</button>`:''}</header><div class="ruler" aria-hidden="true"></div>

const IMP_HEAD=['kode','nama','kategori','spesifikasi','jumlah','kondisi','lokasi','sumber dana','kelas'];
function parseCSV(txt){const rows=[];let row=[],cur='',q=false;const sep=(txt.split('\n')[0].match(/;/g)||[]).length>(txt.split('\n')[0].match(/,/g)||[]).length?';':',';
  for(let i=0;i<txt.length;i++){const c=txt[i];if(q){if(c==='"'){if(txt[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}else if(c==='"')q=true;else if(c===sep){row.push(cur);cur=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(cur);cur='';if(row.some(x=>x.trim()!==''))rows.push(row);row=[]}else cur+=c}
  row.push(cur);if(row.some(x=>x.trim()!==''))rows.push(row);return rows}
function buildImport(txt){const rows=parseCSV(txt);if(rows.length<2)return{err:'Data kosong. Sertakan baris judul dan minimal satu baris alat.'};
  const head=rows[0].map(h=>h.trim().toLowerCase());if(!head.includes('nama')||!head.includes('kategori'))return{err:'Baris judul harus memuat kolom "nama" dan "kategori".'};
  const ix=k=>head.indexOf(k),out=[],used=[];const catKey=v=>{v=v.trim();const u=v.toUpperCase();if(CATS[u])return u;const f=Object.entries(CATS).find(([k,n])=>n.toLowerCase()===v.toLowerCase());return f?f[0]:null};
  rows.slice(1).forEach((r,i)=>{const g=k=>ix(k)>=0?(r[ix(k)]||'').trim():'',e=[];const name=g('nama'),cat=catKey(g('kategori')),qty=parseInt(g('jumlah')||'1',10);let cond=(g('kondisi')||'baik').toLowerCase(),code=g('kode').toUpperCase();
    if(!name)e.push('nama kosong');if(!cat)e.push('kategori tidak dikenal');if(!(qty>=1&&qty<=999))e.push('jumlah tidak valid');if(!CONDS.includes(cond))e.push('kondisi harus baik/rusak ringan/rusak berat');
    if(code&&!/^FIS-[A-Z]{3}-\d{3}$/.test(code))e.push('format kode salah');else if(code&&(getTool(code)||used.includes(code)))e.push('kode sudah dipakai');
    if(!code&&cat){code=nextCode(cat,used)}if(code)used.push(code);
    const cls=g('kelas')||'X–XII';if(!CLASSES.includes(cls.replace('-','–')))e.push('kelas tidak valid');
    out.push({line:i+2,code,name,cat,spec:g('spesifikasi'),total:qty,cond,loc:g('lokasi')||S.settings.locations[0],fund:g('sumber dana')||S.settings.funds[0],cls:cls.replace('-','–'),e})});
  return{rows:out}}
function importHTML(){const p=UI.imp;
  return`<section class="card"><h2>Impor alat dari CSV</h2><p class="small muted">Kolom: <span class="mono">${IMP_HEAD.join(', ')}</span>. Kolom kode boleh kosong, kode dibuat otomatis. Pemisah koma atau titik koma.</p>
  <div class="btns" style="margin:10px 0"><button class="btn sm" data-act="copyTpl">${icon('copy')}Salin templat</button><label class="btn sm" style="cursor:pointer">${icon('upload')}Pilih berkas CSV<input type="file" accept=".csv,text/csv,text/plain" hidden data-on="csvFile"></label></div>
  <label class="f">Tempel isi CSV<textarea id="csvtxt" class="mono" style="min-height:130px" placeholder="nama,kategori,jumlah&#10;Bola konduktor,LIS,2">${esc(UI.impTxt||'')}</textarea></label>
  <div class="btns" style="margin-top:10px"><button class="btn pri" data-act="csvPreview">${icon('search')}Pratinjau dan validasi</button></div>
  ${p?(p.err?`<div class="err" role="alert" style="margin-top:12px">${esc(p.err)}</div>`:`<div style="margin-top:12px"><p><b>${p.rows.filter(r=>!r.e.length).length}</b> baris valid, <b>${p.rows.filter(r=>r.e.length).length}</b> bermasalah.</p><div class="tw"><table><thead><tr><th>Baris</th><th>Kode</th><th>Nama</th><th>Kategori</th><th>Jml</th><th>Kondisi</th><th>Status</th></tr></thead><tbody>${p.rows.map(r=>`<tr><td>${r.line}</td><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td><td>${esc(r.cat?CATS[r.cat]:'-')}</td><td>${r.total}</td><td>${esc(r.cond)}</td><td>${r.e.length?`<span class="badge s-bro">${icon('x')}${esc(r.e.join('; '))}</span>`:`<span class="badge s-ok">${icon('check')}Valid</span>`}</td></tr>`).join('')}</tbody></table></div><div class="btns" style="margin-top:10px"><button class="btn pri" data-act="csvImport" ${p.rows.some(r=>!r.e.length)?'':'disabled'}>${icon('plus')}Impor baris valid</button></div></div>`):''}</section>`}

const toolPhotosHTML=()=>PH.tool.length?PH.tool.map((p,i)=>`<div style="position:relative"><img src="${p}" alt="Pratinjau foto ${i+1}" style="width:96px;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--ln)"><button type="button" class="iconbtn" style="position:absolute;right:2px;top:2px;min-width:32px;min-height:32px" data-act="rmFormPhoto" data-i="${i}" aria-label="Hapus foto ${i+1}">${icon('x')}</button></div>`).join(''):'<span class="small muted">Belum ada foto. Foto belum tersedia akan tampil sebagai placeholder.</span>';
/* ============ Laporan ============ */
function rpRange(){const r=UI.rp,T=today();if(r.mode==='all')return['0000-01-01','9999-12-31','Seluruh periode'];if(r.mode==='30')return[addDays(T,-30),T,'30 hari terakhir'];
  if(r.mode==='custom'&&r.from&&r.to)return[r.from,r.to,`${fmtDate(r.from)} s.d. ${fmtDate(r.to)}`];const d=new Date();const f=isoOf(new Date(d.getFullYear(),d.getMonth(),1));return[f,T,d.toLocaleDateString('id-ID',{month:'long',year:'numeric'})]}
function reportData(){const[f,t,label]=rpRange(),inR=d=>d>=f&&d<=t;
  const cats=Object.keys(CATS).map(k=>{const ts=S.tools.filter(x=>catOf(x)===k),c={tersedia:0,dipinjam:0,perbaikan:0,rusak:0};ts.forEach(x=>c[statusOf(x)]++);return{k,n:ts.length,...c}});
  const loans=S.loans.filter(l=>(l.status==='dipinjam'||l.status==='dikembalikan')&&inR(l.dateOut));
  const late=loans.filter(l=>l.status==='dipinjam'?l.dateDue<today():(l.returnedAt&&isoOf(new Date(l.returnedAt))>l.dateDue));
  const mt=S.maint.filter(m=>inR(m.date)),dmg=S.maint.filter(m=>m.kind==='laporan'&&inR(m.date));
  const tally=(arr,fn)=>{const o={};arr.forEach(x=>{o[x.code]=(o[x.code]||0)+fn(x)});return Object.entries(o).sort((a,b)=>b[1]-a[1]).slice(0,5)};
  return{label,cats,loans,late,mt,dmg,top:tally(loans,()=>1),often:tally(S.maint.filter(m=>m.kind==='laporan'),()=>1),rusak:S.tools.filter(x=>statusOf(x)==='rusak'||x.broken>0)}}
function reportCSV(d){const L=[];L.push(['Laporan LabFis',S.settings.school,d.label].map(csvEsc).join(','));L.push('');L.push(['Kategori','Jumlah alat','Tersedia','Dipinjam','Dalam Perbaikan','Rusak'].map(csvEsc).join(','));
  d.cats.forEach(c=>L.push([CATS[c.k],c.n,c.tersedia,c.dipinjam,c.perbaikan,c.rusak].map(csvEsc).join(',')));const tot=k=>d.cats.reduce((a,c)=>a+c[k],0);L.push(['Total',tot('n'),tot('tersedia'),tot('dipinjam'),tot('perbaikan'),tot('rusak')].map(csvEsc).join(','));
  L.push('');L.push(['Ringkasan periode','Nilai'].map(csvEsc).join(','));[['Peminjaman',d.loans.length],['Terlambat',d.late.length],['Catatan pemeliharaan',d.mt.length],['Laporan kerusakan',d.dmg.length]].forEach(r=>L.push(r.map(csvEsc).join(',')));
  L.push('');L.push(['Paling sering dipinjam','Kali'].map(csvEsc).join(','));d.top.forEach(([c,n])=>L.push([`${c} ${(getTool(c)||{}).name||''}`,n].map(csvEsc).join(',')));
  L.push('');L.push(['Paling sering rusak','Kali'].map(csvEsc).join(','));d.often.forEach(([c,n])=>L.push([`${c} ${(getTool(c)||{}).name||''}`,n].map(csvEsc).join(',')));return L.join('\n')}
PAGES.laporan={title:'Laporan',html(){const d=reportData(),r=UI.rp;const tot=k=>d.cats.reduce((a,c)=>a+c[k],0);

  return`<header class="ph"><div><h1>Laporan</h1><p class="sub">${esc(S.settings.school)}, periode ${esc(d.label)}</p></div><div class="btns noprint"><button class="btn" data-act="printPage">${icon('print')}Cetak / simpan PDF</button></div></header><div class="ruler noprint" aria-hidden="true"></div>

   ${r.mode==='custom'?`<input type="date" data-on="rpFrom" value="${esc(r.from)}" aria-label="Dari tanggal"><input type="date" data-on="rpTo" value="${esc(r.to)}" aria-label="Sampai tanggal">`:''}</div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:12px">${[['Peminjaman',d.loans.length],['Terlambat',d.late.length],['Pemeliharaan',d.mt.length],['Laporan rusak',d.dmg.length]].map(([l,n])=>`<div class="card"><div class="muted small">${l}</div><div style="font:700 34px 'Fraunces',serif">${n}</div></div>`).join('')}</div>

  <div class="two" style="margin-top:14px"><section class="card"><h2>Perencanaan pengadaan</h2><h3 style="margin:8px 0 4px">Paling sering dipinjam</h3>${rank(d.top)}<h3 style="margin:12px 0 4px">Paling sering rusak</h3>${rank(d.often)}<h3 style="margin:12px 0 4px">Ada unit rusak (butuh penggantian)</h3>${d.rusak.length?`<ul style="margin:0;padding-left:20px">${d.rusak.map(t=>`<li>${esc(t.name)} <span class="muted small">${t.broken} dari ${t.total} ${esc(t.u)} rusak</span></li>`).join('')}</ul>`:'<p class="muted small">Tidak ada.</p>'}</section>
  <section class="card noprint"><h2>Ekspor CSV</h2><textarea id="csvout" readonly class="mono" style="min-height:220px">${esc(reportCSV(d))}</textarea><div class="btns" style="margin-top:8px"><button class="btn" data-act="copyCsv">${icon('copy')}Salin CSV</button></div></section></div>`}};

    if(e.length){$('#derr').innerHTML=errBox(e);return}reportDamage(t,n,val(f,'finding'),PH.damage);PH.damage=null;trail('Laporan kerusakan',`${t.code}, ${n} unit`);save();closeModal();toast('Laporan kerusakan dicatat');render(true)},
  maint(f){need('maint.write');const t=getTool(val(f,'code')),type=val(f,'type'),n=parseInt(val(f,'units'),10),e=[];
    if(!t)e.push('Pilih alat.');if(!val(f,'date'))e.push('Tanggal wajib diisi.');if(!val(f,'officer'))e.push('Petugas wajib diisi.');if(!val(f,'finding'))e.push('Temuan wajib diisi.');if(!val(f,'action'))e.push('Tindakan wajib diisi.');
    if(t&&type==='perbaikan'&&!(n>=1&&n<=avail(t)))e.push(`Unit diperbaiki harus antara 1 dan ${avail(t)}.`);if(e.length){$('#merr').innerHTML=errBox(e);return}
    const m={id:uid('MT'),code:t.code,type,kind:'manual',date:val(f,'date'),finding:val(f,'finding'),action:val(f,'action'),officer:val(f,'officer'),result:val(f,'result'),units:type==='perbaikan'?n:0,photo:PH.maint||null,status:type==='perbaikan'?'berjalan':'selesai',ts:Date.now()};
    if(type==='perbaikan'){t.repair+=n;recomputeCond(t)}S.maint.unshift(m);PH.maint=null;trail('Catatan pemeliharaan',`${t.code}, ${type}`);save();UI.rw='catatan';toast('Catatan disimpan');render()},
  mfinish(f){need('maint.write');const m=S.maint.find(x=>x.id===f.dataset.id),t=m&&getTool(m.code);if(!m||!t)return;const u=Math.min(m.units,t.repair),gagal=val(f,'res')==='gagal';t.repair-=u;if(gagal)t.broken+=u;recomputeCond(t);
    m.status='selesai';m.result=gagal?'Tidak dapat diperbaiki':'Berfungsi baik'+(val(f,'note')?', '+val(f,'note'):'');if(gagal&&val(f,'note'))m.result+=': '+val(f,'note');trail('Perbaikan selesai',`${t.code}, ${gagal?'gagal':'berhasil'}`);save();closeModal();toast('Hasil perbaikan disimpan');render(true)},
  sched(f){need('maint.write');const t=getTool(val(f,'code')),ev=parseInt(val(f,'every'),10),e=[];if(!t)e.push('Pilih alat.');if(!(ev>=7))e.push('Interval minimal 7 hari.');if(!val(f,'last'))e.push('Tanggal terakhir wajib diisi.');if(e.length){$('#serr').innerHTML=errBox(e);return}
    S.sched.push({id:uid('JD'),code:t.code,type:val(f,'type'),every:ev,last:val(f,'last'),note:val(f,'note')});trail('Jadwal ditambahkan',`${t.code}, tiap ${ev} hari`);save();closeModal();render(true)},
  dosched(f){need('maint.write');const s=S.sched.find(x=>x.id===f.dataset.id);if(!s)return;if(!val(f,'finding')||!val(f,'action')){$('#dserr').innerHTML=errBox(['Temuan dan tindakan wajib diisi.']);return}
    S.maint.unshift({id:uid('MT'),code:s.code,type:s.type==='perawatan'?'pemeriksaan':s.type,kind:'jadwal',date:today(),finding:val(f,'finding'),action:val(f,'action'),officer:ROLES[role].short,result:val(f,'result'),units:0,photo:null,status:'selesai',ts:Date.now()});
    s.last=today();trail('Pemeliharaan rutin selesai',`${s.code}, ${s.type}`);save();closeModal();toast('Pemeliharaan rutin dicatat');render(true)},
  audit(f){need('audit.write');const t=getTool(val(f,'code')),q=parseInt(val(f,'qty'),10),e=[];if(!t)e.push('Pilih alat.');if(!(q>=0))e.push('Isi jumlah ditemukan (0 bila tidak ada).');else if(t&&q>t.total)e.push(`Jumlah ditemukan melebihi data (${t.total}).`);if(e.length){$('#aerr').innerHTML=errBox(e);return}
    const cond=val(f,'cond'),loc=val(f,'loc'),worse=CONDS.indexOf(cond)>CONDS.indexOf(t.cond);
    S.audits.unshift({id:uid('AU'),code:t.code,date:today(),cond,loc,qtyFound:q,note:val(f,'note'),photo:PH.audit||null,by:role,ts:Date.now()});
    t.loc=loc;t.lastAudit=today();t.trace=q===0?'tidak ditemukan':q<t.total?`hanya ${q} dari ${t.total} ditemukan`:null;
    if(worse&&q>0)reportDamage(t,cond==='rusak berat'?avail(t):1,'Ditemukan saat audit: kondisi '+cond,PH.audit);PH.audit=null;
    trail('Audit alat',`${t.code}, ditemukan ${q}`);save();UI.au=t.trace?'telusur':'riwayat';toast(t.trace?'Audit disimpan. Alat masuk daftar Perlu ditelusuri.':'Audit disimpan');render()},
  tool(f){need('tool.write');const code=f.dataset.code,n=!code,t=n?null:getTool(code),e=[],total=parseInt(val(f,'total'),10),cond=val(f,'cond');
    if(!val(f,'name'))e.push('Nama alat wajib diisi.');if(!(total>=1&&total<=999))e.push('Jumlah unit antara 1 dan 999.');
    if(t&&total<t.borrowed+t.repair+t.broken)e.push(`Jumlah unit tidak boleh kurang dari unit yang sedang dipinjam, diperbaiki, atau rusak (${t.borrowed+t.repair+t.broken}).`);
    if(t&&cond==='baik'&&(t.repair+t.broken>0))e.push('Masih ada unit rusak atau diperbaiki. Selesaikan lewat menu Pemeliharaan sebelum kondisi diubah ke baik.');
    if(t&&cond==='rusak berat'&&(t.borrowed>0||t.repair>0))e.push('Ada unit dipinjam atau diperbaiki. Selesaikan terlebih dahulu sebelum menandai rusak berat.');
    if(e.length){$('#terr').innerHTML=errBox(e);return}
    const d={name:val(f,'name'),spec:val(f,'spec'),total,u:val(f,'u')==='set'?'set':'unit',cond,loc:val(f,'loc'),fund:val(f,'fund'),cls:val(f,'cls'),notes:val(f,'notes'),credit:val(f,'credit'),photos:[...PH.tool].filter(okImg).slice(0,3)};
    if(n){const cat=val(f,'cat');const c=nextCode(cat);S.tools.push({...d,code:c,borrowed:0,repair:0,broken:cond==='rusak berat'?total:0,trace:null,lastAudit:null});S.meta.ctr[cat]=+c.slice(-3);trail('Alat ditambahkan',c)}
    else{Object.assign(t,d);if(cond==='rusak berat')t.broken=total;trail('Data alat diubah',t.code)}
    PH.tool=null;save();toast('Data alat disimpan');go('#/kelola')},
  school(f){need('settings');S.settings.school=val(f,'school')||S.settings.school;trail('Nama sekolah diubah',S.settings.school);save();toast('Tersimpan');render(true)},
  addItem(f){need('settings');const k=f.dataset.k,v=val(f,'v');if(!v)return;if(S.settings[k].includes(v)){toast('Sudah ada dalam daftar.');return}S.settings[k].push(v);trail('Daftar diubah',`${k}: tambah ${v}`);save();render(true)},
  async changePin(f){need('settings');const box=$('#perr'),lk=lockOf('chg'),left=Math.ceil((lk.until-Date.now())/1000);if(left>0){box.innerHTML=errBox([`Percobaan terlalu banyak. Coba lagi dalam ${fmtDur(left)}.`]);return}
    const target=val(f,'target'),n1=val(f,'n1'),n2=val(f,'n2');let ok=false;try{ok=await checkCred(val(f,'cur'),A.lab)}catch(e){}
    if(!ok){lk.fails++;if(lk.fails>=5){lk.until=Date.now()+LOCKS[Math.min(lk.level,3)]*1000;lk.level++;lk.fails=0}await saveAuth();trail('Ubah PIN gagal','PIN Laboran tidak sesuai');box.innerHTML=errBox(['PIN Laboran saat ini tidak sesuai.']);return}
    const e=[];if(!/^\d{6}$/.test(n1))e.push('PIN baru harus tepat 6 angka.');else if(weakPin(n1))e.push('PIN baru terlalu mudah ditebak (angka sama atau berurutan).');else if(n1!==n2)e.push('Konfirmasi PIN baru tidak sama.');
    if(!e.length)for(const k of Object.keys(ROLES)){if(k!==target&&await checkCred(n1,A[k])){e.push('PIN itu sudah dipakai peran lain. Pilih PIN yang berbeda.');break}}
    if(e.length){box.innerHTML=errBox(e);return}
    lk.fails=0;lk.level=0;A[target]=await makeCred(n1);await saveAuth();trail('PIN diubah',ROLES[target].name);f.reset();box.innerHTML='<div class="okbox" role="status">PIN berhasil diubah.</div>'}
};
/* ============ Delegasi & inisialisasi ============ */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const fn=acts[b.dataset.act];if(!fn)return;try{const r=fn(b,e);if(r&&r.catch)r.catch(er=>toast(er.message||'Terjadi kesalahan.'))}catch(er){toast(er.message||'Terjadi kesalahan.')}});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.gal .main[role=button]')){e.preventDefault();e.target.click();return}
  if(role||!A||view!=='login'||modals.length)return;const tg=e.target;if(tg&&/INPUT|TEXTAREA|SELECT/.test(tg.tagName))return;
  if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace'){L.pin=L.pin.slice(0,-1);updateDots()}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=forms[f.dataset.form];if(!fn)return;try{const r=fn(f);if(r&&r.catch)r.catch(er=>toast(er.message||'Terjadi kesalahan.'))}catch(er){toast(er.message||'Terjadi kesalahan.')}});
const onChange=e=>{const el=e.target.closest&&e.target.closest('[data-on]');if(!el)return;const t=e.type,k=el.dataset.on,textual=['catq','qrQ','trQ'].includes(k);if(textual?t!=='input':t!=='change')return;const fn=ons[k];if(fn)try{const r=fn(el,e);if(r&&r.catch)r.catch(er=>toast(er.message||'Terjadi kesalahan.'))}catch(er){toast(er.message||'Terjadi kesalahan.')}};
document.addEventListener('input',onChange);document.addEventListener('change',onChange);
(async function init(){
  try{await Store.init();S=await Store.get('labfis:state');A=await Store.get('labfis:auth');
    if(!S||!Array.isArray(S.tools)){S=seed();await Store.set('labfis:state',S)}
    S.meta=S.meta||{lastBackup:null,ctr:{}};S.meta.ctr=S.meta.ctr||{};S.audits=S.audits||[];S.sched=S.sched||[];S.trail=S.trail||[];}
  catch(e){S=seed()}
  if(A&&!A.lab)A=null;
  if(/^#\/alat\//.test(location.hash))pending=location.hash;
  render();
})();

</script>
